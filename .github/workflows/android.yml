name: Android Enterprise CI/CD

on:
  push:
    branches: [ "**" ]
  workflow_dispatch:

jobs:
  build:
    name: Build Production AAB & APK
    runs-on: ubuntu-latest
    permissions: write-all

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.10.2'

    - name: Accept SDK Licenses and ensure API 36 Platform
      run: |
        yes | sdkmanager --licenses || true
        sdkmanager "platforms;android-36" || true

    - name: Setup Production Release Keystore
      run: |
        if [ ! -f "upload-keystore.jks" ]; then
          echo "Generating official release keystore..."
          keytool -genkeypair -v \
            -keystore upload-keystore.jks \
            -alias upload \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass "EnterpriseIptv2026!" \
            -keypass "EnterpriseIptv2026!" \
            -dname "CN=Enterprise IPTV, OU=Production, O=Enterprise, L=Cairo, ST=Cairo, C=EG"
        fi
        
        cat <<EOF > keystore.properties
        storeFile=upload-keystore.jks
        storePassword=EnterpriseIptv2026!
        keyAlias=upload
        keyPassword=EnterpriseIptv2026!
        EOF

    - name: Build Release Bundle (AAB) & APK
      run: gradle :app:bundleRelease :app:assembleRelease --stacktrace --no-daemon

    - name: Publish Official GitHub Release (Permanent & Quota-Free)
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        TAG="v1.1.0-vc4-run${{ github.run_number }}"
        gh release create "$TAG" \
          app/build/outputs/bundle/release/*.aab \
          app/build/outputs/apk/release/*.apk \
          upload-keystore.jks \
          --title "Enterprise IPTV v1.1.0 (VersionCode 4)" \
          --notes "Major feature release: Multi-View Quad-Screen (2 to 4 channels), 24h EPG Guide, Kids Safe Space with PIN, Stream Auto-Healing, PiP, and Fast Zapping." || true

    - name: Upload Production AAB Artifact (For Google Play)
      uses: actions/upload-artifact@v4
      continue-on-error: true
      with:
        name: app-release-aab
        path: app/build/outputs/bundle/release/*.aab
        retention-days: 1

    - name: Upload Production APK Artifact (For Testing)
      uses: actions/upload-artifact@v4
      continue-on-error: true
      with:
        name: app-release-apk
        path: app/build/outputs/apk/release/*.apk
        retention-days: 1

    - name: Upload Release Keystore Artifact
      uses: actions/upload-artifact@v4
      continue-on-error: true
      with:
        name: upload-keystore
        path: upload-keystore.jks
        retention-days: 1