# Gradle Performance
org.gradle.jvmargs=-Xmx3072m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true
android.nonTransitiveRClass=true

# Enterprise R8 & DEX Optimization
# Full Mode enables aggressive inlining, class merging, and maximum dead code elimination
android.enableR8.fullMode=true
android.enableD8Desugaring=true
android.enableR8.dexSharding=false

# Suppress compileSdk 36 warnings if AGP checks standard released list
android.suppressUnsupportedCompileSdk=36
kotlin.incremental=true
